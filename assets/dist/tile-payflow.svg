<svg xmlns="http://www.w3.org/2000/svg" width="280" height="270" viewBox="0 0 280 270" role="img">
<defs>
  <linearGradient id="wt-grid-bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#111827"/>
    <stop offset="1" stop-color="#080b14"/>
  </linearGradient>
  <linearGradient id="wt-grid-accent" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fb923c"/>
    <stop offset="1" stop-color="#f43f5e"/>
  </linearGradient>
  <radialGradient id="wt-grid-glow" cx=".5" cy="0" r=".8">
    <stop offset="0" stop-color="#fb923c" stop-opacity=".3"/>
    <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="wt-grid-edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".3"/>
    <stop offset=".5" stop-color="#fb923c" stop-opacity=".18"/>
    <stop offset="1" stop-color="#f43f5e" stop-opacity=".42"/>
  </linearGradient>
  <filter id="wt-grid-shadow" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#02040a" flood-opacity=".5"/>
  </filter>
  <clipPath id="wt-grid-clip"><rect x="1" y="1" width="278" height="268" rx="34"/></clipPath></defs>

  <g filter="url(#wt-grid-shadow)">
    <rect x="1" y="1" width="278" height="268" rx="34" fill="url(#wt-grid-bg)" stroke="url(#wt-grid-edge)" stroke-width="1.6"/>
  </g>
  <g clip-path="url(#wt-grid-clip)">
    <rect x="1" y="1" width="278" height="268" rx="34" fill="url(#wt-grid-glow)"/>
    <g opacity=".07" transform="translate(196 176) scale(4.2)">
    <rect x="3" y="3" width="7.2" height="7.2" rx="2.1" fill="#fff"/>
    <rect x="13.8" y="3" width="7.2" height="7.2" rx="2.1" fill="#fff" opacity=".82"/>
    <rect x="3" y="13.8" width="7.2" height="7.2" rx="2.1" fill="#fff" opacity=".82"/>
    <rect x="13.8" y="13.8" width="7.2" height="7.2" rx="2.1" fill="#fff" opacity=".58"/></g>
  </g>
  <rect x="2.5" y="2.5" width="275" height="265" rx="32.5" fill="none" stroke="#ffffff" stroke-opacity=".06"/>
  <rect x="26" y="2" width="228" height="1.5" rx=".75" fill="#ffffff" fill-opacity=".26"/>

  <rect x="28" y="28" width="66" height="66" rx="20" fill="url(#wt-grid-accent)"/>
  <rect x="28" y="28" width="66" height="66" rx="20" fill="none" stroke="#ffffff" stroke-opacity=".32"/>
  <g transform="translate(45 45) scale(1.3333333333333333)">
    <rect x="3" y="3" width="7.2" height="7.2" rx="2.1" fill="#fff"/>
    <rect x="13.8" y="3" width="7.2" height="7.2" rx="2.1" fill="#fff" opacity=".82"/>
    <rect x="3" y="13.8" width="7.2" height="7.2" rx="2.1" fill="#fff" opacity=".82"/>
    <rect x="13.8" y="13.8" width="7.2" height="7.2" rx="2.1" fill="#fff" opacity=".58"/></g>

  <text x="28" y="158" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">PayFlow</text>
  <text x="28" y="186" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="2" fill="#c7d2e5" fill-opacity=".68">PAYMENT DASHBOARD</text>

  <rect x="28" y="210" width="122" height="32" rx="16" fill="#fb923c" fill-opacity=".14" stroke="#fb923c" stroke-opacity=".45"/>
  <text x="89" y="231" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.4" fill="#fb923c">OPEN SOURCE</text>
  
</svg>
