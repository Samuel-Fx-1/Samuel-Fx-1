<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="720" height="540">
  <style>
    :root {
      --bg: #0A0A14; --card: #16162E; --text: #E8E8FF; --muted: #9C9CBE;
      --green: #34D399; --red: #FF5F57; --orange: #FF8C00; --border: rgba(255,255,255,0.12);
      --grid: rgba(255,255,255,0.06);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #F4F4FA; --card: #FFFFFF; --text: #0A0A14; --muted: #5A5A7A;
        --green: #10B981; --red: #DC2626; --orange: #E07A00; --border: rgba(0,0,0,0.08);
        --grid: rgba(0,0,0,0.06);
      }
    }
    .ui { font-family: system-ui, "Segoe UI", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "Consolas", "Menlo", monospace; }
    @keyframes draw { from { stroke-dashoffset: 600; } to { stroke-dashoffset: 0; } }
    @keyframes moveDot { 0% { transform: translate(120px, 290px); } 100% { transform: translate(580px, 180px); } }
    @keyframes pulse { 0%,100% { r: 6; opacity: 1; } 50% { r: 9; opacity: 0.7; } }
    .line { stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw 2.6s ease-out 0.3s forwards; }
    .dot { animation: moveDot 2.6s ease-out 0.3s forwards, pulse 1.4s ease-in-out infinite 2.9s; }
  </style>

  <rect width="720" height="540" fill="var(--bg)"/>
  <rect x="90" y="70" width="540" height="400" rx="18" fill="var(--card)" stroke="var(--border)" stroke-width="1"/>
  <text x="120" y="108" class="ui" font-size="15" font-weight="600" fill="var(--text)">Edge · Price chart</text>
  <text x="580" y="108" text-anchor="end" class="mono" font-size="12" fill="var(--green)">+3.2%</text>

  <!-- grid -->
  <g stroke="var(--grid)" stroke-width="1">
    <line x1="120" y1="160" x2="600" y2="160"/>
    <line x1="120" y1="220" x2="600" y2="220"/>
    <line x1="120" y1="280" x2="600" y2="280"/>
    <line x1="120" y1="340" x2="600" y2="340"/>
  </g>

  <!-- price line -->
  <path class="line" d="M120 290 L180 270 L240 300 L300 250 L360 230 L420 260 L480 200 L540 220 L580 180"
        fill="none" stroke="var(--green)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- moving dot -->
  <circle class="dot" cx="0" cy="0" r="6" fill="var(--orange)" style="transform: translate(120px,290px)"/>

  <!-- axis labels -->
  <text x="120" y="385" class="mono" font-size="10" fill="var(--muted)">09:30</text>
  <text x="340" y="385" text-anchor="middle" class="mono" font-size="10" fill="var(--muted)">12:00</text>
  <text x="580" y="385" text-anchor="end" class="mono" font-size="10" fill="var(--muted)">16:00</text>

  <text x="360" y="510" text-anchor="middle" class="ui" font-size="14" fill="var(--muted)">Edge · trading journal</text>
</svg>
