<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 420px; height: 90px; overflow: hidden; }
  body { font-family: "Segoe UI", system-ui, Arial, sans-serif; padding: 12px; }
  .chip {
    width: 100%; height: 100%; border-radius: 18px; padding: 0 18px;
    display: flex; align-items: center; gap: 12px;
    border: 1px solid var(--border); backdrop-filter: blur(16px);
  }
  .dark .chip { background: rgba(255,255,255,0.07); --border: rgba(255,255,255,0.16); color: #E8E8FF; }
  .light .chip { background: rgba(255,255,255,0.75); --border: rgba(0,0,0,0.08); color: #0A0A14; }
  .icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: #fff; flex-shrink: 0; }
  .label { font-size: 15px; font-weight: 600; }
  .url { font-family: ui-monospace, Consolas, Menlo, monospace; font-size: 10px; opacity: 0.7; margin-left: auto; }
</style>
</head>
<body class="dark" id="root">
  <div class="chip">
    <div class="icon" id="icon">P</div>
    <div class="label" id="label">Portfolio</div>
    <div class="url" id="url">samuelportfolio-seven.vercel.app</div>
  </div>
<script>
  const q = new URLSearchParams(location.search);
  document.body.className = q.get('theme') || 'dark';
  document.getElementById('icon').textContent = q.get('letter') || 'P';
  document.getElementById('icon').style.background = q.get('grad') || 'linear-gradient(135deg,#9B59FF,#4D4DFF)';
  document.getElementById('label').textContent = q.get('label') || 'Portfolio';
  document.getElementById('url').textContent = q.get('url') || '';
</script>
</body>
</html>
