<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 80px; overflow: hidden; }
  body { font-family: "Segoe UI", system-ui, Arial, sans-serif; padding: 8px 0; }
  .pill {
    width: 100%; height: 100%; border-radius: 18px; padding: 0 28px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    border: 1px solid var(--border); backdrop-filter: blur(16px);
  }
  .dark .pill { background: rgba(255,255,255,0.06); --border: rgba(255,255,255,0.14); color: #E8E8FF; }
  .light .pill { background: rgba(255,255,255,0.75); --border: rgba(0,0,0,0.08); color: #0A0A14; }
  .title { font-size: 18px; font-weight: 700; }
  .caption { font-size: 12px; opacity: 0.7; text-align: right; max-width: 60%; }
  .accent { color: #FF8C00; }
  .light .accent { color: #E07A00; }
</style>
</head>
<body class="dark">
  <div class="pill">
    <div class="title" id="title">Projects in motion</div>
    <div class="caption" id="caption">animated previews of real work</div>
  </div>
<script>
  const q = new URLSearchParams(location.search);
  document.body.className = q.get('theme') || 'dark';
  document.getElementById('title').textContent = q.get('title') || '';
  document.getElementById('caption').textContent = q.get('caption') || '';
</script>
</body>
</html>
