<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 4px; overflow: hidden; }
  body { background: transparent; }
  .line {
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, #FF8C00, #16E6EE, #4D4DFF, transparent);
    opacity: 0.7;
  }
  .light .line { background: linear-gradient(90deg, transparent, #E07A00, #0099A8, #3A3ACC, transparent); opacity: 0.5; }
</style>
</head>
<body class="dark">
  <div class="line"></div>
<script>
  const q = new URLSearchParams(location.search);
  document.body.className = q.get('theme') || 'dark';
</script>
</body>
</html>
